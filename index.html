<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>♡ بحبك ♡</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a0a, #2d0a0a, #1a0a0a);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ========== قلب كبير جداً بيتحرك ========== */
        .heart-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            animation: floatHeart 4s ease-in-out infinite;
        }

        @keyframes floatHeart {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            25% {
                transform: translateY(-30px) rotate(-5deg);
            }
            75% {
                transform: translateY(30px) rotate(5deg);
            }
        }

        .big-heart {
            font-size: 250px;
            animation: pulse 1s ease-in-out infinite;
            cursor: pointer;
            display: inline-block;
            text-shadow: 0 0 100px rgba(255, 50, 80, 0.8), 0 0 200px rgba(255, 50, 80, 0.4);
            user-select: none;
            background: none;
            border: none;
            line-height: 1;
            transition: 0.1s;
            position: relative;
        }

        .big-heart:hover {
            transform: scale(1.1);
            text-shadow: 0 0 150px rgba(255, 50, 80, 1), 0 0 300px rgba(255, 50, 80, 0.6);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            60% { transform: scale(1); }
        }

        /* ========== كلمة "بحبك" بتظهر وتتحرك ========== */
        .love-word {
            position: fixed;
            font-size: 80px;
            font-weight: bold;
            color: #ff4d6d;
            text-shadow: 0 0 50px rgba(255, 50, 80, 0.6), 0 0 100px rgba(255, 50, 80, 0.3);
            pointer-events: none;
            z-index: 3;
            animation: flyWord 8s ease-in-out infinite;
            opacity: 0;
        }

        .love-word.show {
            opacity: 1;
        }

        @keyframes flyWord {
            0% {
                transform: translate(0, 0) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            20% {
                transform: translate(100px, -200px) scale(1.2) rotate(10deg);
                opacity: 1;
            }
            40% {
                transform: translate(-150px, -100px) scale(1) rotate(-15deg);
                opacity: 1;
            }
            60% {
                transform: translate(200px, 100px) scale(1.3) rotate(20deg);
                opacity: 1;
            }
            80% {
                transform: translate(-100px, 200px) scale(0.9) rotate(-10deg);
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) scale(0.5) rotate(0deg);
                opacity: 0;
            }
        }

        /* ========== قلوب متطايرة ========== */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-float {
            position: absolute;
            font-size: 30px;
            animation: floatUp linear infinite;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.5);
                opacity: 0;
            }
        }

        /* ========== فقاعات ========== */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            border-radius: 50%;
            animation: bubbleUp linear infinite;
            border: 1px solid rgba(255, 182, 193, 0.15);
        }

        @keyframes bubbleUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% {
                transform: translateY(-110vh) scale(2.5);
                opacity: 0;
            }
        }

        /* ========== نجوم ========== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            color: #fff;
            animation: twinkle 2.5s ease-in-out infinite;
            opacity: 0.3;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ========== زخات القلوب ========== */
        .heart-rain {
            position: fixed;
            top: -50px;
            font-size: 40px;
            animation: rainDown linear infinite;
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes rainDown {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(1.8);
                opacity: 0;
            }
        }

        /* ========== العنوان ========== */
        .title {
            color: #ffb6c1;
            font-size: 48px;
            font-weight: bold;
            margin-top: 30px;
            text-shadow: 0 0 40px rgba(255, 50, 80, 0.4);
            letter-spacing: 3px;
            position: relative;
            z-index: 2;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; text-shadow: 0 0 60px rgba(255, 50, 80, 0.6); }
        }

        .subtitle {
            color: #ff8fa3;
            font-size: 26px;
            margin-top: 15px;
            opacity: 0.9;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
            animation: floatText 3s ease-in-out infinite;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ========== رسالة الحالة ========== */
        #status {
            color: #ffb6c1;
            font-size: 32px;
            margin-top: 30px;
            font-weight: bold;
            min-height: 60px;
            transition: 0.5s;
            text-shadow: 0 0 30px rgba(255, 50, 80, 0.4);
            position: relative;
            z-index: 2;
        }

        /* ========== الأزرار ========== */
        .button-container {
            margin-top: 40px;
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            min-height: 80px;
            z-index: 2;
        }

        .btn {
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            z-index: 2;
        }

        .btn-yes {
            background: linear-gradient(145deg, #ff4d6d, #d84b6b);
            color: white;
            box-shadow: 0 8px 0 #892e44, 0 15px 40px rgba(216, 75, 107, 0.4);
            animation: btnPulse 2s ease-in-out infinite;
        }

        @keyframes btnPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 8px 0 #892e44, 0 20px 60px rgba(216, 75, 107, 0.6); }
        }

        .btn-yes:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 10px 0 #892e44, 0 20px 50px rgba(216, 75, 107, 0.6);
        }

        .btn-yes:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #892e44;
        }

        .btn-no {
            background: linear-gradient(145deg, #5a5a5a, #3a3a3a);
            color: white;
            box-shadow: 0 8px 0 #1a1a1a;
            position: relative;
            transition: 0.1s;
            z-index: 2;
        }

        .btn-no:hover {
            background: linear-gradient(145deg, #6a6a6a, #4a4a4a);
        }

        /* ========== كلمة "بحبك" الطائرة ========== */
        .flying-text {
            position: fixed;
            font-size: 100px;
            font-weight: bold;
            color: #ff4d6d;
            text-shadow: 0 0 80px rgba(255, 50, 80, 0.8);
            pointer-events: none;
            z-index: 5;
            animation: flyAround 6s ease-in-out infinite;
            opacity: 0;
        }

        .flying-text.show {
            opacity: 1;
        }

        @keyframes flyAround {
            0% {
                transform: translate(0, 0) scale(0.3) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translate(50px, -100px) scale(1) rotate(5deg);
            }
            30% {
                transform: translate(-200px, -50px) scale(1.2) rotate(-10deg);
            }
            50% {
                transform: translate(300px, 50px) scale(1.5) rotate(15deg);
            }
            70% {
                transform: translate(-150px, 150px) scale(1.1) rotate(-8deg);
            }
            90% {
                transform: translate(100px, -50px) scale(1.3) rotate(8deg);
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) scale(0.3) rotate(0deg);
                opacity: 0;
            }
        }

        /* ========== تكيف للموبايل ========== */
        @media (max-width: 480px) {
            .big-heart { font-size: 160px; }
            .title { font-size: 32px; }
            .subtitle { font-size: 20px; }
            .btn { padding: 14px 30px; font-size: 20px; }
            #status { font-size: 24px; }
            .love-word { font-size: 50px; }
            .flying-text { font-size: 60px; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-20px); }
            40% { transform: translateX(20px); }
            60% { transform: translateX(-15px); }
            80% { transform: translateX(15px); }
        }

        @keyframes bgPulse {
            0%, 100% { background: linear-gradient(135deg, #1a0a0a, #2d0a0a, #1a0a0a); }
            50% { background: linear-gradient(135deg, #2d0a0a, #4a0a0a, #2d0a0a); }
        }

        body.bg-glow {
            animation: bgPulse 1s ease;
        }

        /* ========== رسائل الحب المتغيرة ========== */
        .love-message {
            color: #ff8fa3;
            font-size: 22px;
            margin-top: 25px;
            opacity: 0.8;
            min-height: 40px;
            transition: 0.5s;
            font-weight: 500;
            position: relative;
            z-index: 2;
            animation: floatText 3s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <!-- ========== قلوب متطايرة ========== -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- ========== فقاعات ========== -->
    <div class="bubbles" id="bubbles"></div>

    <!-- ========== نجوم ========== -->
    <div class="stars" id="stars"></div>

    <!-- ========== كلمة "بحبك" الطائرة ========== -->
    <div class="flying-text" id="flyingText">💕 بحبك 💕</div>

    <!-- ========== كلمة "بحبك" الثابتة (تظهر وتختفي) ========== -->
    <div class="love-word" id="loveWord">❤️ بحبك ❤️</div>

    <!-- ========== المحتوى الرئيسي ========== -->
    <div class="heart-wrapper">

        <!-- القلب الكبير جداً -->
        <button class="big-heart" id="mainHeart" onclick="showLove()">❤️</button>

        <!-- العنوان -->
        <div class="title">أحلى بنت في الدنيا 💕</div>
        <div class="subtitle">قلبي بينبض باسمك</div>

        <!-- رسالة الحالة -->
        <div id="status">💖 أنتِ كل حياتي</div>

        <!-- رسائل حب متغيرة -->
        <div class="love-message" id="loveMessage">❤️ اضغط على القلب</div>

        <!-- الأزرار -->
        <div class="button-container">
            <button class="btn btn-yes" onclick="sayYes()">🩷 بحبك</button>
            <button class="btn btn-no" id="noBtn" onmouseover="runAway()">💔 لا</button>
        </div>
    </div>

    <script>
        // =============================================
        // ========== كل الجافاسكريبت هنا ==========
        // =============================================

        // ---- 1. قلوب متطايرة ----
        function createFloatingHearts() {
            var container = document.getElementById('floatingHearts');
            var hearts = ['❤️', '💕', '💖', '💗', '💓', '♥️', '💝'];

            for (var i = 0; i < 40; i++) {
                var heart = document.createElement('span');
                heart.className = 'heart-float';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (25 + Math.random() * 50) + 'px';
                heart.style.animationDuration = (12 + Math.random() * 22) + 's';
                heart.style.animationDelay = (Math.random() * 18) + 's';
                container.appendChild(heart);
            }
        }
        createFloatingHearts();

        // ---- 2. فقاعات ----
        function createBubbles() {
            var container = document.getElementById('bubbles');
            for (var i = 0; i < 30; i++) {
                var bubble = document.createElement('span');
                bubble.className = 'bubble';
                bubble.style.left = Math.random() * 100 + '%';
                var size = 15 + Math.random() * 45;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.animationDuration = (18 + Math.random() * 28) + 's';
                bubble.style.animationDelay = (Math.random() * 25) + 's';
                bubble.style.background = 'rgba(255, 182, 193, ' + (0.05 + Math.random() * 0.1) + ')';
                container.appendChild(bubble);
            }
        }
        createBubbles();

        // ---- 3. نجوم ----
        function createStars() {
            var container = document.getElementById('stars');
            var emojis = ['✦', '✧', '⭐', '✨', '💫', '✶'];

            for (var i = 0; i < 70; i++) {
                var star = document.createElement('span');
                star.className = 'star';
                star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.fontSize = (12 + Math.random() * 26) + 'px';
                star.style.animationDelay = (Math.random() * 4) + 's';
                star.style.animationDuration = (2 + Math.random() * 3) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        // ---- 4. زخات القلوب ----
        function createHeartRain(count) {
            count = count || 1;
            for (var j = 0; j < count; j++) {
                setTimeout(function() {
                    var body = document.body;
                    var heart = document.createElement('span');
                    heart.className = 'heart-rain';
                    var hearts = ['❤️', '💕', '💖', '💗', '💓', '♥️', '💝'];
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = (Math.random() * 92 + 4) + '%';
                    heart.style.fontSize = (30 + Math.random() * 55) + 'px';
                    heart.style.animationDuration = (3.5 + Math.random() * 4.5) + 's';
                    body.appendChild(heart);

                    setTimeout(function() {
                        heart.remove();
                    }, 8000);
                }, j * 120);
            }
        }

        // ---- 5. رسائل الحب ----
        var loveMessages = [
            "♡ يا روح قلبي، أنتِ كل حاجة في حياتي",
            "♡ ضحكتك بتخلص هموم الدنيا كلها",
            "♡ عينيكي البحر اللي عايز أغرق فيه",
            "♡ من غيرك الدنيا رماد يا قمر",
            "♡ كل يوم بحبك أكتر من اللي قبله",
            "♡ يا ست الكل، أنتِ ملكة قلبي",
            "♡ حبك جوة دمي ومش طايق أستنى",
            "♡ لو الدنيا تروح وترجع، هختارك أنتِ",
            "♡ أنتِ أحلى هدية من ربنا ليا",
            "♡ كلام الحب قليل قدام عيونك",
            "♡ بحبك موت يا حبيبتي",
            "♡ عمري كله ليكِ أنتِ"
        ];

        var statusMessages = [
            "💖 أنتِ كل حياتي",
            "💕 قلبي ملكك أنتِ",
            "❤️ بحبك موت",
            "💗 أنتِ روحي",
            "💓 عمري كله ليكِ",
            "♥️ حبيبتي الأبدية",
            "💝 أنتِ ملكة قلبي"
        ];

        function showLove() {
            // تغيير رسالة الحب
            var msgBox = document.getElementById('loveMessage');
            var randomIndex = Math.floor(Math.random() * loveMessages.length);
            msgBox.textContent = loveMessages[randomIndex];
            msgBox.style.opacity = '0';
            setTimeout(function() { msgBox.style.opacity = '1'; }, 100);

            // تغيير رسالة الحالة
            var status = document.getElementById('status');
            var statusIndex = Math.floor(Math.random() * statusMessages.length);
            status.textContent = statusMessages[statusIndex];
            status.style.transform = 'scale(1.3)';
            status.style.color = '#ff6b8a';
            setTimeout(function() {
                status.style.transform = 'scale(1)';
                status.style.color = '#ffb6c1';
            }, 400);

            // زخات قلوب (12 قلب)
            createHeartRain(12);

            // تأثير وميض الخلفية
            document.body.classList.add('bg-glow');
            setTimeout(function() {
                document.body.classList.remove('bg-glow');
            }, 1000);

            // تكبير القلب مؤقتاً
            var heart = document.getElementById('mainHeart');
            heart.style.transform = 'scale(1.5)';
            setTimeout(function() {
                heart.style.transform = 'scale(1)';
            }, 300);

            // إظهار كلمة "بحبك" الطائرة
            var flyingText = document.getElementById('flyingText');
            flyingText.classList.add('show');
            setTimeout(function() {
                flyingText.classList.remove('show');
            }, 6000);

            // إظهار كلمة "بحبك" الثابتة
            var loveWord = document.getElementById('loveWord');
            loveWord.classList.add('show');
            setTimeout(function() {
                loveWord.classList.remove('show');
            }, 3000);
        }

        // ---- 6. زر "بحبك" ----
        function sayYes() {
            var status = document.getElementById('status');
            status.textContent = '❤️ أنا كمان بحبك موت ❤️';
            status.style.color = '#ff6b8a';
            status.style.fontSize = '44px';
            status.style.transform = 'scale(1.4)';
            setTimeout(function() {
                status.style.transform = 'scale(1)';
            }, 500);

            // زخات قلوب كثيفة (30 قلب)
            createHeartRain(30);

            // تغيير خلفية
            document.body.style.background = 'linear-gradient(135deg, #4a0a0a, #6a0a0a, #4a0a0a)';
            setTimeout(function() {
                document.body.style.background = 'linear-gradient(135deg, #1a0a0a, #2d0a0a, #1a0a0a)';
            }, 3000);

            // تغيير نص الزر
            var btn = document.querySelector('.btn-yes');
            btn.textContent = '❤️ أنتِ ملكتي';
            btn.style.background = 'linear-gradient(145deg, #ff6b8a, #ff4d6d)';
            btn.style.fontSize = '28px';
            btn.style.padding = '20px 55px';

            // تكبير القلب
            var heart = document.getElementById('mainHeart');
            heart.style.transform = 'scale(1.7)';
            setTimeout(function() {
                heart.style.transform = 'scale(1)';
            }, 500);

            // تغيير رسالة الحب
            document.getElementById('loveMessage').textContent = '💖 أنتِ كل الدنيا بالنسبة لي';

            // إظهار كلمة "بحبك" الطائرة
            var flyingText = document.getElementById('flyingText');
            flyingText.classList.add('show');
            setTimeout(function() {
                flyingText.classList.remove('show');
            }, 8000);

            // إظهار كلمة "بحبك" الثابتة
            var loveWord = document.getElementById('loveWord');
            loveWord.classList.add('show');
            setTimeout(function() {
                loveWord.classList.remove('show');
            }, 4000);

            // تشغيل تأثير إضافي كل 2 ثانية
            var interval = setInterval(function() {
                createHeartRain(5);
            }, 2000);

            setTimeout(function() {
                clearInterval(interval);
            }, 8000);
        }

        // ---- 7. زر "لا" يهرب ----
        var noClicks = 0;

        function runAway() {
            var btn = document.getElementById('noBtn');
            var container = document.querySelector('.button-container');
            var rect = container.getBoundingClientRect();

            var maxX = rect.width - btn.offsetWidth - 20;
            var maxY = rect.height - btn.offsetHeight - 20;

            var newX = Math.random() * maxX;
            var newY = Math.random() * maxY;

            btn.style.position = 'absolute';
            btn.style.left = newX + 'px';
            btn.style.top = newY + 'px';
            btn.style.transition = '0.08s';

            noClicks++;

            var msgs = [
                '😘 أنتِ عارفة إنك بتحبيني',
                '💕 مش هتهربي من الحقيقة',
                '❤️ قولي بحبك يا جميلة',
                '🌹 أنتِ ملكة قلبي',
                '💖 متستنيش كتير'
            ];

            if (noClicks > 3) {
                var status = document.getElementById('status');
                status.textContent = msgs[Math.floor(Math.random() * msgs.length)];
                status.style.color = '#ff8fa3';
            }

            // بعد 7 محاولات، الزر يتحول لـ "بحبك"
            if (noClicks > 7) {
                btn.textContent = '😘 أحبك';
                btn.style.background = 'linear-gradient(145deg, #ff4d6d, #d84b6b)';
                btn.style.boxShadow = '0 8px 0 #892e44';
                btn.style.color = 'white';
                btn.style.fontSize = '26px';
                btn.style.padding = '18px 50px';

                setTimeout(function() {
                    sayYes();
                }, 600);
                return;
            }

            // تهتز الشاشة
            document.body.style.animation = 'shake 0.3s';
            setTimeout(function() { document.body.style.animation = ''; }, 300);

            // قلب يتساقط
            createHeartRain(2);
        }

        // ---- 8. تغيير الرسالة كل 5 ثواني ----
        setInterval(function() {
            var msgBox = document.getElementById('loveMessage');
            var randomIndex = Math.floor(Math.random() * loveMessages.length);
            msgBox.textContent = loveMessages[randomIndex];
        }, 5000);

        // ---- 9. كلمة "بحبك" تظهر وتختفي تلقائياً ----
        setInterval(function() {
            var loveWord = document.getElementById('loveWord');
            loveWord.classList.add('show');
            setTimeout(function() {
                loveWord.classList.remove('show');
            }, 3000);
        }, 7000);

        console.log('❤️ موقع الحب جاهز!');
        console.log('💕 كل القلوب بتنبض ليكِ');
        console.log('💖 قلبك بينبض بالحب');
        console.log('❤️ بحبك ❤️');
    </script>

</body>
</html>
